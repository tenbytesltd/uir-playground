name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pages does not publish from a private repository on this organisation's
    # plan, and hosted minutes are billed while it is private — so every push to
    # the default branch would put a red deploy on a branch whose code is fine.
    # SKIPPED rather than failed while private, and it starts working on the day
    # visibility changes with no edit here: the same derivation `ci.yml` uses for
    # its runner, for the same reason. A red that means "not yet" teaches readers
    # to ignore reds.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
